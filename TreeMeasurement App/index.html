<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수목 측정 조사 앱</title>
  </head>
  <body style="margin: 0; background-color: #111; color: white;">
    <div id="root">
      <!-- 앱이 정상 실행되면 이 문구는 사라집니다. 계속 보이면 JavaScript가 실행되지 않은 것입니다. -->
      <p style="padding: 20px; font-family: sans-serif;">앱을 불러오는 중… (이 문구가 계속 보이면 새로고침하거나 배포 설정을 확인하세요)</p>
    </div>
    <script>
      // 모듈 로딩 전에 나는 오류도 화면에 표시
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && !root.dataset.rendered) {
          root.innerHTML = '<div style="padding:20px;font-family:sans-serif"><h3>⚠️ 오류</h3><pre style="white-space:pre-wrap;color:#fca5a5">' +
            String(e.message || e.error || '알 수 없는 오류').replace(/</g, '&lt;') + '</pre></div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
